<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Zorza OS – znak: łuki zorzy nad wschodzącym słońcem na linii horyzontu -->
  <defs>
    <linearGradient id="zz-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2350"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>
    <linearGradient id="zz-aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2FD4C4"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF6FA3"/>
    </linearGradient>
    <linearGradient id="zz-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF6FA3"/>
    </linearGradient>
    <radialGradient id="zz-glow" cx="0.5" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#FF6FA3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6FA3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="zz-above"><rect x="0" y="0" width="512" height="318"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#zz-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#zz-glow)"/>
  <g fill="none" stroke="url(#zz-aurora)" stroke-linecap="round">
    <path d="M104 262 C 150 120, 362 120, 408 262" stroke-width="22" opacity="0.95"/>
    <path d="M140 270 C 176 178, 336 178, 372 270" stroke-width="18" opacity="0.75"/>
    <path d="M176 276 C 200 226, 312 226, 336 276" stroke-width="14" opacity="0.55"/>
  </g>
  <circle cx="256" cy="318" r="58" fill="url(#zz-sun)" clip-path="url(#zz-above)"/>
  <rect x="88" y="314" width="336" height="10" rx="5" fill="#F4F5FB"/>
  <rect x="150" y="346" width="212" height="8" rx="4" fill="#F4F5FB" opacity="0.45"/>
  <rect x="200" y="372" width="112" height="6" rx="3" fill="#F4F5FB" opacity="0.22"/>
</svg>
