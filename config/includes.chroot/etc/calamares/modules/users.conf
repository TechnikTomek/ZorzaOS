---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - sudo
    - adm
    - audio
    - video
    - cdrom
    - plugdev
    - netdev
    - lpadmin
    - bluetooth
    - scanner
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, live ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "zorza-${cpu}"
  forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
