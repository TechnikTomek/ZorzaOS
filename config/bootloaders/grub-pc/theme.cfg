set color_normal=light-gray/black
set color_highlight=white/magenta
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta

if [ -e /boot/grub/zorza/theme.txt ]; then
	loadfont /boot/grub/zorza/inter_regular_16.pf2
	loadfont /boot/grub/zorza/inter_regular_20.pf2
	loadfont /boot/grub/zorza/inter_bold_24.pf2
	set theme=/boot/grub/zorza/theme.txt
	export theme
fi
