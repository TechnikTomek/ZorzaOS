# Zorza OS @ZORZA_VERSION@ (@ZORZA_ARCH@) – menu startowe
source /boot/grub/config.cfg

set zorza_common="@APPEND_LIVE@"

menuentry "Zorza OS @ZORZA_VERSION@ — Live (Polski)" --hotkey=p --class zorza {
	linux	@KERNEL_LIVE@ ${zorza_common} locales=pl_PL.UTF-8 keyboard-layouts=pl
	initrd	@INITRD_LIVE@
}

menuentry "Zorza OS @ZORZA_VERSION@ — Live (English)" --hotkey=e --class zorza {
	linux	@KERNEL_LIVE@ ${zorza_common} locales=en_US.UTF-8 keyboard-layouts=us
	initrd	@INITRD_LIVE@
}

submenu "Opcje zaawansowane / Advanced options …" --hotkey=a --class settings {
	source /boot/grub/theme.cfg

	menuentry "Tryb bezpieczny grafiki / Safe graphics (PL)" --class zorza {
		linux	@KERNEL_LIVE@ ${zorza_common} locales=pl_PL.UTF-8 keyboard-layouts=pl nomodeset zorza.safegraphics=1
		initrd	@INITRD_LIVE@
	}
	menuentry "Safe graphics mode (English)" --class zorza {
		linux	@KERNEL_LIVE@ ${zorza_common} locales=en_US.UTF-8 keyboard-layouts=us nomodeset zorza.safegraphics=1
		initrd	@INITRD_LIVE@
	}
	menuentry "Załaduj do RAM / Load to RAM (toram, PL)" --class zorza {
		linux	@KERNEL_LIVE@ ${zorza_common} locales=pl_PL.UTF-8 keyboard-layouts=pl toram
		initrd	@INITRD_LIVE@
	}
	menuentry "Tryb tekstowy, bez ekranu startowego / Verbose boot" --class zorza {
		linux	@KERNEL_LIVE@ boot=live components username=live hostname=zorza timezone=Europe/Warsaw locales=pl_PL.UTF-8 keyboard-layouts=pl
		initrd	@INITRD_LIVE@
	}
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Sprawdź nośnik / Verify boot medium" --class settings {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Ustawienia UEFI / UEFI firmware settings" --class settings {
			fwsetup
		}
	fi
}

menuentry "Uruchom ponownie / Reboot" --class restart {
	reboot
}
menuentry "Wyłącz / Power off" --class shutdown {
	halt
}
